name: Apply mechanism coverage repair

on:
  push:
    branches:
      - codex/mechanism-coverage-repair

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mechanism-coverage-repair
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded mechanism coverage repair
        run: node scripts/apply-mechanism-coverage.mjs
      - name: Build and run complete regression suite
        run: npm test
      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-mechanism-coverage.mjs
          rm .github/workflows/apply-mechanism-coverage.yml
      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover omitted mechanism knowledge"
          git push origin HEAD:codex/mechanism-coverage-repair
