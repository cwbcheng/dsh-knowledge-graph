name: Apply semantic closure and relation-aware layout

on:
  push:
    branches:
      - codex/semantic-closure-relation-layout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/semantic-closure-relation-layout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded semantic and layout patch
        run: node scripts/apply-semantic-closure-layout.mjs
      - name: Build and run all regressions
        run: npm test
      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-semantic-closure-layout.mjs
          rm .github/workflows/apply-semantic-closure-layout.yml
      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close semantic gaps and project reasoning paths"
          git push origin HEAD:codex/semantic-closure-relation-layout
