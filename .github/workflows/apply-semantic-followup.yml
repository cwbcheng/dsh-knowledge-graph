name: Apply semantic integration follow-up

on:
  push:
    branches:
      - codex/minimal-semantic-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/minimal-semantic-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semantic integration follow-up
        run: node scripts/apply-semantic-followup.mjs
      - name: Build and run all regressions
        run: npm test
      - name: Remove one-shot tooling
        run: |
          rm scripts/apply-semantic-followup.mjs
          rm .github/workflows/apply-semantic-followup.yml
      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete claim semantic integration"
          git push origin HEAD:codex/minimal-semantic-contract
