name: Apply trust-boundary fixes

on:
  push:
    branches: [codex/trust-boundary-fixes]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/trust-boundary-fixes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded review fixes
        run: node scripts/apply-review-fixes.mjs
      - name: Rebuild generated artifacts
        run: npm run build
      - name: Run complete regression suite
        run: npm test
      - name: Remove one-shot tooling
        run: rm scripts/apply-review-fixes.mjs .github/workflows/apply-trust-boundary-fixes.yml
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore evidence trust boundaries"
          git push origin HEAD:codex/trust-boundary-fixes
