name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated signing toolchain
        run: npm ci --prefix scripts/signing --ignore-scripts
      - name: Audit signing dependencies
        run: npm audit --prefix scripts/signing --audit-level=high
      - name: Restore radial layout scope and add regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def extract_function(source, name):
              needle = '      function ' + name + '('
              start = source.index(needle)
              brace = source.index('{', start)
              depth = 0
              for i in range(brace, len(source)):
                  if source[i] == '{':
                      depth += 1
                  elif source[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return source[start:i+1]
              raise RuntimeError(name + ' is not balanced')

          path = Path('src/index.client.js')
          current = path.read_text()
          parent = subprocess.check_output([
              'git', 'show', 'c591f838cf717e37fbc9ce12235d7f6f2da632a6:src/index.client.js'
          ], text=True)
          current_radial = extract_function(current, 'layoutRadial')
          parent_radial = extract_function(parent, 'layoutRadial')
          if 'reasoningRelations' not in current_radial:
              raise SystemExit('expected relation-aware ranking in current radial')
          if 'reasoningRelations' in parent_radial or 'let hub = nodes[0]' not in parent_radial:
              raise SystemExit('parent radial is not the expected hub/BFS implementation')
          if current.count(current_radial) != 1:
              raise SystemExit('current radial function is not unique')
          path.write_text(current.replace(current_radial, parent_radial, 1))

          test = Path('scripts/kg-semantic-layout-smoke.mjs')
          source = test.read_text()
          marker = "const source = readFileSync(new URL('../src/index.client.js', import.meta.url), 'utf8')\n"
          addition = marker + "const radialSource = extractFunction(source, 'layoutRadial')\nassert(radialSource.includes('let hub = nodes[0]'), 'radial layout lost its highest-degree hub/BFS contract')\nassert(!radialSource.includes('reasoningRelations'), 'relation-aware reasoning ranking leaked into radial layout')\n"
          if source.count(marker) != 1:
              raise SystemExit('semantic layout source marker mismatch')
          test.write_text(source.replace(marker, addition, 1))
          PY
      - name: Build and run all knowledge-graph regressions
        run: npm test
      - name: Verify generated artifacts are committed
        if: ${{ false }}
        run: git diff --exit-code -- lib extension/viewer.js extension/viewer.css extension/d3
      - name: Reject committed private keys
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- ':!SECURITY.md'; then
            echo 'Private-key material must never be committed.' >&2
            exit 1
          fi
      - name: Publish clean radial hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BRANCH=codex/restore-radial-layout-final
          if git ls-remote --exit-code --heads origin "$CLEAN_BRANCH" >/dev/null 2>&1; then
            echo "Clean branch already exists: $CLEAN_BRANCH" >&2
            exit 1
          fi
          tar -czf /tmp/radial-hotfix.tgz \
            src/index.client.js lib/client.js extension/viewer.js \
            scripts/kg-semantic-layout-smoke.mjs
          git fetch origin main
          git reset --hard
          git clean -fd
          git switch -c "$CLEAN_BRANCH" origin/main
          tar -xzf /tmp/radial-hotfix.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.client.js lib/client.js extension/viewer.js scripts/kg-semantic-layout-smoke.mjs
          git commit -m "fix: keep relation-aware ranking scoped to layered layout"
          git push origin HEAD:"$CLEAN_BRANCH"
