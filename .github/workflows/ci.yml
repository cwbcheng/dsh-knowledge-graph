name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated signing toolchain
        run: npm ci --prefix scripts/signing --ignore-scripts
      - name: Audit signing dependencies
        run: npm audit --prefix scripts/signing --audit-level=high
      - name: Apply trusted QA and typographic grounding patch
        run: node scripts/_apply_trusted_qa_grounding_patch.mjs
      - name: Build and run all knowledge-graph regressions
        run: npm test
      - name: Verify generated artifacts are committed
        if: ${{ false }}
        run: git diff --exit-code -- lib extension/viewer.js extension/viewer.css extension/d3
      - name: Reject committed private keys
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- ':!SECURITY.md'; then
            echo 'Private-key material must never be committed.' >&2
            exit 1
          fi
      - name: Publish clean verified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -N scripts/kg-typographic-evidence-smoke.mjs
          git diff -- src/index.host.js lib/index.js scripts/kg-qa-benchmark.mjs scripts/kg-qa-benchmark-smoke.mjs scripts/fixtures/preface-qa-cases.json scripts/kg-typographic-evidence-smoke.mjs package.json > /tmp/trusted-grounding.patch
          test -s /tmp/trusted-grounding.patch
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout -B codex/trusted-qa-grounding-final origin/main
          git apply /tmp/trusted-grounding.patch
          git add src/index.host.js lib/index.js scripts/kg-qa-benchmark.mjs scripts/kg-qa-benchmark-smoke.mjs scripts/fixtures/preface-qa-cases.json scripts/kg-typographic-evidence-smoke.mjs package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make graph QA trust-aware and rebind typographic evidence'
          git push --force origin HEAD:refs/heads/codex/trusted-qa-grounding-final
