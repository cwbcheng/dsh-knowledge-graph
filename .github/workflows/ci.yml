name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated signing toolchain
        run: npm ci --prefix scripts/signing --ignore-scripts
      - name: Audit signing dependencies
        run: npm audit --prefix scripts/signing --audit-level=high
      - name: Apply bounded semantic and layout patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-semantic-closure-layout.mjs')
          s = p.read_text()
          old = "client = replaceOnce(client, oldLayerSeed, newLayerSeed, 'relation-aware layered ranking')"
          new = "client = replaceCount(client, oldLayerSeed, newLayerSeed, 2, 'relation-aware layered ranking')"
          if s.count(old) != 1:
              raise SystemExit('staging replacement patch target mismatch')
          p.write_text(s.replace(old, new))
          PY
          node scripts/apply-semantic-closure-layout.mjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/kg-semantic-closure-smoke.mjs')
          s = p.read_text()
          old = "issue.code === 'counter_example_without_target'"
          new = "issue.invariantCode === 'counter_example_without_target'"
          if s.count(old) != 1:
              raise SystemExit('semantic closure public issue assertion target mismatch')
          p.write_text(s.replace(old, new))

          p = Path('scripts/kg-semantic-layout-smoke.mjs')
          s = p.read_text()
          old = "assert(pos.get(x).y < pos.get(c).y, 'analogy satellite was not placed as a branch near its target')"
          new = "assert(pos.get('x').y < pos.get('c').y, 'analogy satellite was not placed as a branch near its target')"
          if s.count(old) != 1:
              raise SystemExit('semantic layout smoke id target mismatch')
          p.write_text(s.replace(old, new))

          docs = {
            'README.md': (
              '  - **机制覆盖复核**：',
              '  - **解释覆盖复核**：首轮抽取通过后，仅在多步机制疑似欠覆盖，或原文明示纠偏/防误推理限定、留待后文回答的信息却未进入图时，执行一次受限复核；它也可恢复被多个核心命题反复引用的稳定概念锚点。复核只能补缺失节点及其必要关系，不能重写已有图，也不会为了连通率补知识。'
            ),
            'README.en.md': (
              '  - **Mechanism coverage review**:',
              '  - **Explanatory coverage review**: after the first extraction passes deterministic admission, a bounded second look runs only when a multi-step mechanism appears underrepresented or the source explicitly states a correction / anti-misinference boundary / answer deferred to later text that the graph omitted. It may also recover a stable concept anchor reused by multiple core propositions. The review may only add missing nodes plus necessary incident relations; it cannot rewrite the accepted graph or add knowledge merely to improve connectivity.'
            ),
          }
          for name, (prefix, replacement) in docs.items():
              p = Path(name)
              s = p.read_text().replace('\\n- **', '\n- **')
              lines = s.splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(name + ': explanatory coverage bullet count=' + str(len(hits)))
              lines[hits[0]] = replacement
              p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Build and run all knowledge-graph regressions
        run: npm test
      - name: Verify generated artifacts are committed
        if: ${{ false }}
        run: git diff --exit-code -- lib extension/viewer.js extension/viewer.css extension/d3
      - name: Reject committed private keys
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- ':!SECURITY.md'; then
            echo 'Private-key material must never be committed.' >&2
            exit 1
          fi
      - name: Publish final clean branch
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_BRANCH=codex/semantic-closure-relation-layout-final
          if git ls-remote --exit-code --heads origin "$CLEAN_BRANCH" >/dev/null 2>&1; then
            echo "Clean branch already exists: $CLEAN_BRANCH" >&2
            exit 1
          fi
          tar -czf /tmp/semantic-closure-final.tgz \
            README.md README.en.md package.json \
            src/index.host.js src/index.client.js \
            lib/index.js lib/client.js \
            extension/viewer.js extension/viewer.css \
            scripts/kg-semantic-closure-smoke.mjs scripts/kg-semantic-layout-smoke.mjs
          git fetch origin main
          git reset --hard
          git clean -fd
          git switch -c "$CLEAN_BRANCH" origin/main
          tar -xzf /tmp/semantic-closure-final.tgz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md package.json \
            src/index.host.js src/index.client.js \
            lib/index.js lib/client.js \
            extension/viewer.js extension/viewer.css \
            scripts/kg-semantic-closure-smoke.mjs scripts/kg-semantic-layout-smoke.mjs
          git commit -m "fix: close semantic gaps and project reasoning paths"
          git push origin HEAD:"$CLEAN_BRANCH"
