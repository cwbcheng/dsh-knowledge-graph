name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated signing toolchain
        run: npm ci --prefix scripts/signing --ignore-scripts
      - name: Audit signing dependencies
        run: npm audit --prefix scripts/signing --audit-level=high
      - name: Apply held-out generalization v2 patch
        run: node scripts/_apply_heldout_generalization_v2_patch.mjs
      - name: Build and run all knowledge-graph regressions
        run: npm test
      - name: Verify generated artifacts are committed
        if: ${{ false }}
        run: git diff --exit-code -- lib extension/viewer.js extension/viewer.css extension/d3
      - name: Reject committed private keys
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- ':!SECURITY.md'; then
            echo 'Private-key material must never be committed.' >&2
            exit 1
          fi
      - name: Publish clean verified branch
        shell: bash
        run: |
          set -euo pipefail
          git add -N scripts/fixtures/world-recognition-part1-qa-cases-calibrated-v2.json
          git diff -- src/index.host.js lib/index.js scripts/kg-mechanism-coverage-smoke.mjs scripts/kg-connectivity-smoke.mjs scripts/fixtures/world-recognition-part1-qa-cases-calibrated-v2.json > /tmp/heldout-generalization-v2.patch
          test -s /tmp/heldout-generalization-v2.patch
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout -B codex/heldout-generalization-v2-final origin/main
          git apply /tmp/heldout-generalization-v2.patch
          git add src/index.host.js lib/index.js scripts/kg-mechanism-coverage-smoke.mjs scripts/kg-connectivity-smoke.mjs scripts/fixtures/world-recognition-part1-qa-cases-calibrated-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: improve section and example-role recall'
          git push --force origin HEAD:refs/heads/codex/heldout-generalization-v2-final
