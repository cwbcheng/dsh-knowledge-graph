name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated signing toolchain
        run: npm ci --prefix scripts/signing --ignore-scripts
      - name: Audit signing dependencies
        run: npm audit --prefix scripts/signing --audit-level=high
      - name: Apply worked example coverage patch
        run: node scripts/apply-worked-example-coverage.mjs
      - name: Build and run all knowledge-graph regressions
        run: npm test
      - name: Verify generated artifacts are committed
        if: ${{ false }}
        run: git diff --exit-code -- lib extension/viewer.js extension/viewer.css extension/d3
      - name: Reject committed private keys
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- ':!SECURITY.md'; then
            echo 'Private-key material must never be committed.' >&2
            exit 1
          fi
      - name: Publish clean verified branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main
          git diff --binary origin/main -- \
            src/index.host.js \
            lib/index.js \
            package.json \
            scripts/kg-worked-example-coverage-smoke.mjs \
            scripts/fixtures/preface-qa-cases.json \
            > /tmp/worked-example-coverage.patch
          test -s /tmp/worked-example-coverage.patch
          git reset --hard origin/main
          git checkout -B codex/worked-example-coverage-final origin/main
          git apply /tmp/worked-example-coverage.patch
          git add src/index.host.js lib/index.js package.json scripts/kg-worked-example-coverage-smoke.mjs scripts/fixtures/preface-qa-cases.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain worked examples that anchor mechanisms'
          git push --force origin HEAD:refs/heads/codex/worked-example-coverage-final
