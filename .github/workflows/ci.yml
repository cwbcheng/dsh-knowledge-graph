name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated signing toolchain
        run: npm ci --prefix scripts/signing --ignore-scripts
      - name: Audit signing dependencies
        run: npm audit --prefix scripts/signing --audit-level=high
      - name: Apply bounded reasoning-lane projection
        run: node scripts/apply-reasoning-lanes.mjs
      - name: Build and run all knowledge-graph regressions
        run: npm test
      - name: Verify generated artifacts are committed
        if: ${{ false }}
        run: git diff --exit-code -- lib extension/viewer.js extension/viewer.css extension/d3
      - name: Reject committed private keys
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- ':!SECURITY.md'; then
            echo 'Private-key material must never be committed.' >&2
            exit 1
          fi
      - name: Publish clean verified branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp src/index.client.js "$tmp/index.client.js"
          cp lib/client.js "$tmp/client.js"
          cp extension/viewer.js "$tmp/viewer.js"
          cp scripts/kg-semantic-layout-smoke.mjs "$tmp/kg-semantic-layout-smoke.mjs"
          git fetch origin main
          git checkout --detach origin/main
          cp "$tmp/index.client.js" src/index.client.js
          cp "$tmp/client.js" lib/client.js
          cp "$tmp/viewer.js" extension/viewer.js
          cp "$tmp/kg-semantic-layout-smoke.mjs" scripts/kg-semantic-layout-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.client.js lib/client.js extension/viewer.js scripts/kg-semantic-layout-smoke.mjs
          git commit -m "fix: keep reasoning backbones in readable lanes"
          git push --force origin HEAD:codex/reasoning-lanes-final
