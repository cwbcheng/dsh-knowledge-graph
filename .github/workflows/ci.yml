name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated signing toolchain
        run: npm ci --prefix scripts/signing --ignore-scripts
      - name: Audit signing dependencies
        run: npm audit --prefix scripts/signing --audit-level=high
      - name: Apply bounded semantic and layout patch
        run: node scripts/apply-semantic-closure-layout.mjs
      - name: Build and run all knowledge-graph regressions
        run: npm test
      - name: Export verified staging tree
        uses: actions/upload-artifact@v4
        with:
          name: semantic-closure-verified-tree
          if-no-files-found: error
          path: |
            README.md
            README.en.md
            package.json
            src/index.host.js
            src/index.client.js
            lib/index.js
            lib/client.js
            extension/viewer.js
            extension/viewer.css
            scripts/kg-semantic-closure-smoke.mjs
            scripts/kg-semantic-layout-smoke.mjs
      - name: Reject committed private keys
        shell: bash
        run: |
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- ':!SECURITY.md'; then
            echo 'Private-key material must never be committed.' >&2
            exit 1
          fi
